[project]
name = "sleeperlab"
version = "0.1.0"
description = "Backdoored model organisms and activation-based detectors"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["sleeperlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
